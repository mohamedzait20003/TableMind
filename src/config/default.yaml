# TableMind configuration
# DoT (Krichene et al., 2021) setup on WikiSQL: a small pruning transformer
# selects 256 of 1024 input tokens for a larger task transformer, which here
# is T5 (instead of TAPAS) augmented with a key-value memory.

# Model Configuration
model:
  # Memory encoder settings
  memory_encoder:
    model_name: "t5-base"
    proj_dim: 256  # hidden size is read from the T5 config

  # Pruning transformer: small TAPAS (4 layers, 512 hidden), as DoT(s -> l)
  pruning_transformer:
    model_name: "google/tapas-small-finetuned-wtq"
    top_k: 256  # TAPAS-token budget; whole cells, question and header always kept

  # Task transformer: T5 replaces DoT's second (large) TAPAS
  task_transformer:
    model_name: "t5-base"
    max_length: 512    # T5 input length after re-tokenizing the kept tokens
    use_memory: true   # false = ablation without memory retrieval

# Dataset Configuration
data:
  # PAQ dataset for memory
  paq:
    split: "train"
    num_examples: 30000  # Streamed sample (~0.4% of PAQ_pairs)
    max_length: 64           # question tokens
    passage_max_length: 128  # answer-passage tokens
    eval_ratio: 0.05         # held out for retrieval accuracy
    # tokenized with model.memory_encoder.model_name

  # WikiSQL dataset for training/evaluation (full splits)
  wikisql:
    train_split: "train"
    eval_split: "validation"  # monitored during pretraining
    test_split: "test"        # used only by the evaluation notebook
    train_subset_ratio: 1.0
    eval_subset_ratio: 1.0
    test_subset_ratio: 1.0
    model_name: "google/tapas-small-finetuned-wtq"
    max_length: 1024       # TAPAS input length before pruning, as in DoT
    answer_max_length: 32  # T5 target length for executed SQL answers

# Stage 1: contrastive memory-encoder training on PAQ
memory_training:
  num_epochs: 1
  batch_size: 32  # in-batch negatives: larger is harder
  learning_rate: 1.0e-4
  weight_decay: 0.01
  warmup_ratio: 0.1
  temperature: 0.05
  encode_batch_size: 64  # batch size when filling the memory store
  log_steps: 50

# Stage 2: DoT pretraining on WikiSQL
pretraining:
  num_epochs: 3  # ~21k optimizer steps at batch size 8
  batch_size: 8
  learning_rate: 5.0e-5
  weight_decay: 0.01
  warmup_ratio: 0.1
  scheduler_type: "linear"  # linear, cosine, constant
  gradient_clipping: 1.0
  gradient_accumulation_steps: 1
  log_steps: 100
  memory_top_k: 8  # >1 so the softmax over retrieved entries trains the query projection

# System Configuration
system:
  device: "auto"  # auto, cuda, cpu
  seed: 42        # DoT reports the median of 3 runs: repeat with 3 seeds
  num_workers: 2
  checkpoint_dir: "./checkpoints"  # local copies
  output_dir: "./outputs"          # plots and predictions

# Persistent storage shared by the notebooks (Google Drive on Colab)
storage:
  drive_subdir: "TableMind/checkpoints"  # under MyDrive
  local_dir: "./storage"                 # used outside Colab
  memory_checkpoint: "memory_stage.pt"   # shared by all pretraining runs

# Experiment Configuration
experiment:
  name: "dot_t5_memory"
  description: "DoT with a T5 task transformer and key-value memory on WikiSQL"
  tags: ["dot", "t5", "memory", "table-qa"]
