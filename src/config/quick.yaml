# Quick experiment configuration - faster training for development
# Inherits from default.yaml with overrides for quick testing
base: default.yaml

# Reduced dataset sizes for faster iteration
data:
  paq:
    num_examples: 5000  # Smaller streamed sample
  wikisql:
    train_subset_ratio: 0.02  # 2% of training data
    eval_subset_ratio: 0.05   # 5% of validation data
    test_subset_ratio: 0.1    # 10% of test data
    model_name: "google/tapas-small-finetuned-wtq"

# Faster training settings
memory_training:
  batch_size: 32
  log_steps: 10

pretraining:
  num_epochs: 1
  batch_size: 4
  log_steps: 10

# Lighter model configuration (fits a free Colab T4)
model:
  memory_encoder:
    model_name: "t5-small"  # Smaller model
    proj_dim: 128
  task_transformer:
    model_name: "t5-small"
  pruning_transformer:
    model_name: "google/tapas-small-finetuned-wtq"
    top_k: 64  # Smaller top-k

storage:
  memory_checkpoint: "memory_stage_quick.pt"
  pretrain_checkpoint: "pretrain_final_quick.pt"

experiment:
  name: "dot_model_quick"
  description: "Quick development experiment"
